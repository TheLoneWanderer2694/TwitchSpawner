name: Build Dusklight Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@v2

    - name: Configure CMake
      run: cmake -B build -G Ninja -DDUSK_BUILDING_GAME=OFF -DDUSK_BUILD_MODS_ONLY=ON

    - name: Build Mod
      run: cmake --build build --config Release

    - name: Upload .dusk Artifact
      uses: actions/upload-artifact@v4
      with:
        name: template_mod
        path: build/**/*.dusk
